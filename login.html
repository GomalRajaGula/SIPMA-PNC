<!DOCTYPE html>
<html lang="id" class="bg-gray-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIPMA PNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-indigo-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo & Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-4 shadow-lg shadow-blue-600/30">
                S
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-1">SIPMA PNC</h1>
            <p class="text-sm text-gray-500">Sistem Informasi Poin Keaktifan Mahasiswa</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white border border-gray-200 rounded-2xl shadow-xl p-8">
            <h2 class="text-lg font-bold text-gray-900 mb-6">Masuk ke Sistem</h2>

            <form id="formLogin" class="space-y-4">
                <!-- Role Selection -->
                <div>
                    <label for="roleSelect" class="block text-sm font-semibold text-gray-700 mb-2">Login Sebagai</label>
                    <select id="roleSelect" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50 focus:bg-white transition">
                        <option value="">Pilih Role</option>
                        <option value="mahasiswa">Mahasiswa</option>
                        <option value="dosen">Dosen Wali</option>
                        <option value="baak">Staf BAAK</option>
                    </select>
                    <p id="errorRole" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">
                        <span id="labelUsername">NIM / NIP</span>
                    </label>
                    <input id="username" type="text" placeholder="Masukkan NIM atau NIP" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50 focus:bg-white transition">
                    <p id="errorUsername" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <input id="password" type="password" placeholder="Masukkan password" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-gray-50 focus:bg-white transition">
                    <p id="errorPassword" class="text-xs text-red-500 mt-1 hidden"></p>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition shadow-md shadow-blue-600/30 mt-6">
                    Masuk
                </button>
            </form>

            <!-- Demo Credentials Info -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-xs text-gray-500 font-semibold mb-2">Demo Credentials:</p>
                <div class="space-y-1 text-xs text-gray-600">
                    <p><strong>Mahasiswa:</strong> 250215033 / mhs123</p>
                    <p><strong>Dosen Wali:</strong> 197001011995 / dosen123</p>
                    <p><strong>Staf BAAK:</strong> 198505152010 / baak123</p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            &copy; 2026 Politeknik Negeri Cilacap. All rights reserved.
        </p>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-6 right-6 z-50 space-y-3"></div>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>

</body>
</html>

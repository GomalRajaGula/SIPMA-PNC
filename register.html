<!DOCTYPE html>
<html lang="id" class="bg-gray-50 antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - SIPMA PNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-gray-50 to-blue-50 py-12">
    
    <!-- Ornamen Background -->
    <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-400/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="bg-white w-full max-w-lg rounded-3xl shadow-xl border border-gray-100 p-8 relative z-10 mx-4">
        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <div class="flex items-center space-x-3 cursor-default">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-2xl shadow-md shadow-blue-500/30">S</div>
                <span class="font-bold text-2xl text-gray-900 tracking-tight">SIPMA <span class="text-blue-600">PNC</span></span>
            </div>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Buat Akun Baru</h1>
            <p class="text-sm text-gray-500 mt-1">Daftarkan diri kamu untuk mulai mengelola poin keaktifan</p>
        </div>

        <!-- Form Registrasi -->
        <form action="login.html" class="space-y-4">
            <div>
                <label for="nama" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Achmal Maulana" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900 text-sm" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="nim" class="block text-sm font-semibold text-gray-700 mb-1">NIM</label>
                    <input type="text" id="nim" name="nim" placeholder="250215033" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900 text-sm" required>
                </div>
                <div>
                    <label for="kelas" class="block text-sm font-semibold text-gray-700 mb-1">Kelas / Prodi</label>
                    <select id="kelas" name="kelas" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900 text-sm" required>
                        <option value="">Pilih Prodi</option>
                        <option value="TRPL 2-B" selected>D4 TRPL (TRPL 2-B)</option>
                        <option value="D3 TI">D3 Teknik Informatika</option>
                        <option value="D4 RKS">D4 Rekayasa Keamanan Siber</option>
                    </select>
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900 text-sm" required>
            </div>

            <div>
                <label for="confirm_password" class="block text-sm font-semibold text-gray-700 mb-1">Konfirmasi Password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white text-gray-900 text-sm" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2 mt-6">
                Daftar Akun
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-xs text-gray-500">Sudah punya akun? <a href="login.html" class="text-blue-600 font-semibold hover:underline">Masuk di sini</a></p>
        </div>
    </div>
</body>
</html>
